<!doctype html>
<html>
<head>
  <script>(function(){var t=localStorage.getItem('sg-theme')||'light';document.documentElement.setAttribute('data-bs-theme',t)})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="/static/manifest.json">
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
  </script>
  <style> body { padding: 16px; } </style>
</head>
<body class="bg-light">
  <div class="container" style="max-width: 420px;">
    <div class="card shadow-sm mt-5">
      <div class="card-body">
        <h4 class="mb-3">Seguritec Tarija</h4>
        <p class="text-muted">Ingresa para crear y ver cotizaciones.</p>

        {% if err %}
          <div class="alert alert-danger">{{ err }}</div>
        {% endif %}

        <form method="post" action="/login">
          <div class="mb-2">
            <label class="form-label">Usuario</label>
            <input class="form-control" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Clave</label>
            <input class="form-control" name="password" type="password" required>
          </div>
          <button class="btn btn-dark w-100" type="submit">Entrar</button>
          <button type="button" class="btn btn-outline-secondary w-100 mt-2" onclick="toggleTheme()" id="btnTheme">🌙 Cambiar tema</button>
        </form>
      </div>
    </div>
  </div>
<script>
function toggleTheme(){var el=document.documentElement,t=el.getAttribute('data-bs-theme')==='dark'?'light':'dark';el.setAttribute('data-bs-theme',t);localStorage.setItem('sg-theme',t);var b=document.getElementById('btnTheme');if(b)b.textContent=t==='dark'?'☀️ Cambiar tema':'🌙 Cambiar tema';}
(function(){var b=document.getElementById('btnTheme');if(b)b.textContent=document.documentElement.getAttribute('data-bs-theme')==='dark'?'☀️ Cambiar tema':'🌙 Cambiar tema';})();
</script>
</body>
</html>
