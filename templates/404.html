<!doctype html>
<html lang="es">
<head>
  <script>(function(){var t=localStorage.getItem('sg-theme')||'light';document.documentElement.setAttribute('data-bs-theme',t)})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="text-center p-4">
    <div class="display-1 text-secondary fw-bold">404</div>
    <h4 class="mt-2 mb-1">Página no encontrada</h4>
    <p class="text-muted mb-4">La dirección que buscás no existe o fue movida.</p>
    <a href="/dashboard" class="btn btn-primary">Ir al inicio</a>
    <button onclick="toggleTheme()" class="btn btn-outline-secondary ms-2" id="btnTheme">🌙</button>
  </div>
<script>
function toggleTheme(){var el=document.documentElement,t=el.getAttribute('data-bs-theme')==='dark'?'light':'dark';el.setAttribute('data-bs-theme',t);localStorage.setItem('sg-theme',t);var b=document.getElementById('btnTheme');if(b)b.textContent=t==='dark'?'☀️':'🌙';}
(function(){var b=document.getElementById('btnTheme');if(b)b.textContent=document.documentElement.getAttribute('data-bs-theme')==='dark'?'☀️':'🌙';})();
</script>
</body>
</html>
